name: LCK News

on:
  schedule:
    # every 10 min, off the top of the hour (GitHub drops scheduled runs most at :00)
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write # push state.json to the `state` branch
  actions: write # keep the schedule enabled

concurrency:
  group: lck-news
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore state
        run: |
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json
          else
            echo '{}' > state.json
          fi
          sha256sum state.json > "$RUNNER_TEMP/state.sum"

      - name: Check sources and post to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          BOT_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node src/bot.mjs cloud

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          if sha256sum -c --status "$RUNNER_TEMP/state.sum"; then echo "state unchanged"; exit 0; fi
          git config user.name "lck-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git worktree add -q -B state "$RUNNER_TEMP/st" FETCH_HEAD
          else
            git worktree add -q --orphan -b state "$RUNNER_TEMP/st"
          fi
          cp state.json "$RUNNER_TEMP/st/state.json"
          cd "$RUNNER_TEMP/st"
          git add state.json
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q origin state

      # Public repos lose scheduled workflows after 60 days without activity; re-enabling is a no-op otherwise.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/lck-news.yml/enable" --silent || true
